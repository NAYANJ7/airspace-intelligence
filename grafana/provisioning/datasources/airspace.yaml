apiVersion: 1

# Read-only PostgreSQL data source. ${...} values come from the grafana container's environment
# (docker-compose.yaml, which takes them from .env); no password is stored in this file.
datasources:
  - name: Airspace PostgreSQL
    uid: airspace-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_ro
    isDefault: true
    editable: false
    jsonData:
      database: ${AIRSPACE_PG_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: ${GRAFANA_PG_PASSWORD}